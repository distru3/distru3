<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-labelledby="title desc">
  <title id="title">Almagles</title>
  <desc id="desc">A weekly schedule grid whose days light up from right to left.</desc>
  <defs>
    <clipPath id="card"><rect width="400" height="120" rx="10"/></clipPath>
    <clipPath id="stage"><rect x="236" width="164" height="120"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f8e9d8" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .off   { opacity: .1; animation: dim 4.4s ease-in-out infinite; }
    .on, .today { opacity: .3; animation: lit 4.4s ease-in-out infinite; }
    @keyframes dim { 0%, 30%, 100% { opacity: .1; } 12% { opacity: .26; } }
    @keyframes lit { 0%, 100% { opacity: .3; } 12%, 60% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .off { animation: none; }
      .on, .today { animation: none; opacity: .9; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="400" height="120" fill="#241d27"/>
    <rect width="400" height="120" fill="url(#grid)"/>
    <rect width="4" height="120" fill="#c5e35b"/>
    <text class="sans" x="24" y="62" font-size="30" font-weight="700" letter-spacing="-.02em" fill="#f8e9d8">Almagles</text>
    <text class="mono" x="25" y="86" font-size="11" letter-spacing=".12em" fill="#c5e35b">ARABIC PUBLISHING</text>
    <g clip-path="url(#stage)">
      <rect class="on" x="367" y="37" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 0.0s"/><rect class="off" x="367" y="54" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.0s"/><rect class="off" x="367" y="71" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.0s"/><rect class="off" x="350" y="37" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.22s"/><rect class="off" x="350" y="54" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.22s"/><rect class="on" x="350" y="71" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 0.22s"/><rect class="off" x="333" y="37" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.44s"/><rect class="on" x="333" y="54" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 0.44s"/><rect class="off" x="333" y="71" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.44s"/><rect class="on" x="316" y="37" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 0.66s"/><rect class="today" x="316" y="54" width="12" height="12" rx="2.5" fill="#e77e65" style="animation-delay: 0.66s"/><rect class="off" x="316" y="71" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.66s"/><rect class="off" x="299" y="37" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.88s"/><rect class="off" x="299" y="54" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 0.88s"/><rect class="on" x="299" y="71" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 0.88s"/><rect class="off" x="282" y="37" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 1.1s"/><rect class="on" x="282" y="54" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 1.1s"/><rect class="off" x="282" y="71" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 1.1s"/><rect class="on" x="265" y="37" width="12" height="12" rx="2.5" fill="#c5e35b" style="animation-delay: 1.32s"/><rect class="off" x="265" y="54" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 1.32s"/><rect class="off" x="265" y="71" width="12" height="12" rx="2.5" fill="#f8e9d8" style="animation-delay: 1.32s"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="399" height="119" rx="9.5" fill="none" stroke="#f8e9d8" stroke-opacity=".14"/>
</svg>
