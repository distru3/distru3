<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-labelledby="title desc">
  <title id="title">NASA Space Apps Challenge 2025 — Global Nominee and People's Choice, Cairo</title>
  <desc id="desc">Award strip on a twinkling starfield with a satellite orbiting a small planet.</desc>
  <defs>
    <clipPath id="card"><rect width="840" height="120" rx="12"/></clipPath>
    <linearGradient id="title-fill" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#f8e9d8"/>
      <stop offset="1" stop-color="#e5f394"/>
    </linearGradient>
    <radialGradient id="planet" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#e5f394"/>
      <stop offset="1" stop-color="#7f9a2f"/>
    </radialGradient>
    <linearGradient id="dim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".75" stop-color="#555"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="sky" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="120"><rect width="840" height="120" fill="url(#dim)"/></mask>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .star  { opacity: .2; animation: twinkle 5s ease-in-out infinite; }
    .orbit-x { transform: translateX(62px); animation: sway-x 4s cubic-bezier(.37, 0, .63, 1) infinite alternate; }
    .orbit-y { animation: sway-y 4s cubic-bezier(.37, 0, .63, 1) infinite alternate -2s; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes sway-x { from { transform: translateX(-62px); } to { transform: translateX(62px); } }
    @keyframes sway-y { from { transform: translateY(-24px); } to { transform: translateY(24px); } }
    @media (prefers-reduced-motion: reduce) { .star, .orbit-x, .orbit-y { animation: none; } .star { opacity: .45; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="120" fill="#241d27"/>
    <g mask="url(#sky)"><circle class="star" cx="20" cy="10" r="0.8" fill="#f8e9d8" style="animation-delay: -0.0s"/><circle class="star" cx="217" cy="71" r="1.1" fill="#f8e9d8" style="animation-delay: -3.7s"/><circle class="star" cx="414" cy="32" r="1.5" fill="#f8e9d8" style="animation-delay: -2.4s"/><circle class="star" cx="611" cy="93" r="0.8" fill="#f8e9d8" style="animation-delay: -1.1s"/><circle class="star" cx="808" cy="54" r="1.1" fill="#f8e9d8" style="animation-delay: -4.8s"/><circle class="star" cx="205" cy="15" r="1.5" fill="#f8e9d8" style="animation-delay: -3.5s"/><circle class="star" cx="402" cy="76" r="0.8" fill="#f8e9d8" style="animation-delay: -2.2s"/><circle class="star" cx="599" cy="37" r="1.1" fill="#f8e9d8" style="animation-delay: -0.9s"/><circle class="star" cx="796" cy="98" r="1.5" fill="#f8e9d8" style="animation-delay: -4.6s"/><circle class="star" cx="193" cy="59" r="0.8" fill="#f8e9d8" style="animation-delay: -3.3s"/><circle class="star" cx="390" cy="20" r="1.1" fill="#f8e9d8" style="animation-delay: -2.0s"/><circle class="star" cx="587" cy="81" r="1.5" fill="#f8e9d8" style="animation-delay: -0.7s"/><circle class="star" cx="784" cy="42" r="0.8" fill="#f8e9d8" style="animation-delay: -4.4s"/><circle class="star" cx="181" cy="103" r="1.1" fill="#f8e9d8" style="animation-delay: -3.1s"/><circle class="star" cx="378" cy="64" r="1.5" fill="#f8e9d8" style="animation-delay: -1.8s"/><circle class="star" cx="575" cy="25" r="0.8" fill="#f8e9d8" style="animation-delay: -0.5s"/><circle class="star" cx="772" cy="86" r="1.1" fill="#f8e9d8" style="animation-delay: -4.2s"/><circle class="star" cx="169" cy="47" r="1.5" fill="#f8e9d8" style="animation-delay: -2.9s"/><circle class="star" cx="366" cy="108" r="0.8" fill="#f8e9d8" style="animation-delay: -1.6s"/><circle class="star" cx="563" cy="69" r="1.1" fill="#f8e9d8" style="animation-delay: -0.3s"/><circle class="star" cx="760" cy="30" r="1.5" fill="#f8e9d8" style="animation-delay: -4.0s"/><circle class="star" cx="157" cy="91" r="0.8" fill="#f8e9d8" style="animation-delay: -2.7s"/><circle class="star" cx="354" cy="52" r="1.1" fill="#f8e9d8" style="animation-delay: -1.4s"/><circle class="star" cx="551" cy="13" r="1.5" fill="#f8e9d8" style="animation-delay: -0.1s"/><circle class="star" cx="748" cy="74" r="0.8" fill="#f8e9d8" style="animation-delay: -3.8s"/><circle class="star" cx="145" cy="35" r="1.1" fill="#f8e9d8" style="animation-delay: -2.5s"/><circle class="star" cx="342" cy="96" r="1.5" fill="#f8e9d8" style="animation-delay: -1.2s"/><circle class="star" cx="539" cy="57" r="0.8" fill="#f8e9d8" style="animation-delay: -4.9s"/><circle class="star" cx="736" cy="18" r="1.1" fill="#f8e9d8" style="animation-delay: -3.6s"/><circle class="star" cx="133" cy="79" r="1.5" fill="#f8e9d8" style="animation-delay: -2.3s"/><circle class="star" cx="330" cy="40" r="0.8" fill="#f8e9d8" style="animation-delay: -1.0s"/><circle class="star" cx="527" cy="101" r="1.1" fill="#f8e9d8" style="animation-delay: -4.7s"/><circle class="star" cx="724" cy="62" r="1.5" fill="#f8e9d8" style="animation-delay: -3.4s"/><circle class="star" cx="121" cy="23" r="0.8" fill="#f8e9d8" style="animation-delay: -2.1s"/><circle class="star" cx="318" cy="84" r="1.1" fill="#f8e9d8" style="animation-delay: -0.8s"/><circle class="star" cx="515" cy="45" r="1.5" fill="#f8e9d8" style="animation-delay: -4.5s"/><circle class="star" cx="712" cy="106" r="0.8" fill="#f8e9d8" style="animation-delay: -3.2s"/><circle class="star" cx="109" cy="67" r="1.1" fill="#f8e9d8" style="animation-delay: -1.9s"/><circle class="star" cx="306" cy="28" r="1.5" fill="#f8e9d8" style="animation-delay: -0.6s"/><circle class="star" cx="503" cy="89" r="0.8" fill="#f8e9d8" style="animation-delay: -4.3s"/><circle class="star" cx="700" cy="50" r="1.1" fill="#f8e9d8" style="animation-delay: -3.0s"/><circle class="star" cx="97" cy="11" r="1.5" fill="#f8e9d8" style="animation-delay: -1.7s"/><circle class="star" cx="294" cy="72" r="0.8" fill="#f8e9d8" style="animation-delay: -0.4s"/><circle class="star" cx="491" cy="33" r="1.1" fill="#f8e9d8" style="animation-delay: -4.1s"/><circle class="star" cx="688" cy="94" r="1.5" fill="#f8e9d8" style="animation-delay: -2.8s"/><circle class="star" cx="85" cy="55" r="0.8" fill="#f8e9d8" style="animation-delay: -1.5s"/></g>

    <!-- an ellipse is two sine motions a quarter-period apart -->
    <g transform="translate(748 60) rotate(-18)">
      <ellipse rx="62" ry="24" fill="none" stroke="#f8e9d8" stroke-opacity=".3" stroke-width="1.5"/>
      <g class="orbit-x"><g class="orbit-y"><circle r="5" fill="#e77e65"/></g></g>
    </g>
    <circle cx="748" cy="60" r="19" fill="url(#planet)"/>

    <rect width="4" height="120" fill="#c5e35b"/>
    <text class="mono" x="32" y="38" font-size="12" letter-spacing=".12em" fill="#c5e35b">NASA SPACE APPS CHALLENGE 2025</text>
    <text class="sans" x="31" y="74" font-size="29" font-weight="700" letter-spacing="-.015em" fill="url(#title-fill)">Global Nominee  +  People's Choice</text>
    <text class="mono" x="32" y="99" font-size="12" fill="#c0afaf">team astroos · cairo · advanced past 1,290 projects</text>
  </g>
  <rect x=".5" y=".5" width="839" height="119" rx="11.5" fill="none" stroke="#f8e9d8" stroke-opacity=".14"/>
</svg>
