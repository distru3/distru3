<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Al-Hussein Raed — Software Developer</title>
  <desc id="desc">Name on a dark plum card with a typing prompt cycling through roles, beside a sweeping radar display.</desc>

  <defs>
    <clipPath id="card"><rect width="840" height="300" rx="14"/></clipPath>
    <clipPath id="chip"><rect x="46" y="160" width="340" height="34" rx="6"/></clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f8e9d8" stroke-opacity=".045"/></pattern>

    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="672" cy="150" r="280">
      <stop offset="0" stop-color="#c5e35b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c5e35b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="46" y1="0" x2="570" y2="0">
      <stop offset="0" stop-color="#f8e9d8"/>
      <stop offset=".5" stop-color="#f8e9d8"/>
      <stop offset="1" stop-color="#e5f394"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#c5e35b"/>
      <stop offset=".5" stop-color="#e77e65"/>
      <stop offset="1" stop-color="#c5e35b"/>
    </linearGradient>

    <!-- fades the radar out before it reaches the text -->
    <linearGradient id="reveal" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="radar-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="300">
      <rect width="840" height="300" fill="url(#reveal)"/>
    </mask>

    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- a horizontal line has a zero-height bounding box, so its filter region must be given in user units -->
    <filter id="glow-line" filterUnits="userSpaceOnUse" x="-12" y="-14" width="180" height="28">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    .sweep  { animation: spin 7s linear infinite; }
    .dial   { animation: spin 90s linear infinite reverse; }
    .blip   { opacity: .16; animation: ping 7s linear infinite; }
    .ring   { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ripple 7s ease-out infinite; }
    .live   { animation: breathe 2.8s ease-in-out infinite; }
    .slide  { animation: slide 9s linear infinite; }
    .blink  { animation: blink 1s steps(1, end) infinite; }

    /* typing: each phrase owns a third of the cycle; its cover steps aside one glyph at a time */
    .ph { opacity: 0; animation: slot 12s steps(1, end) infinite; }
    .ph1, .ty1 { animation-delay: 0s; }
    .ty1 { animation: type1 12s steps(18, end) infinite 0s; }
    @keyframes type1 { 0%, 31%, 100% { transform: translateX(0); } 10%, 27% { transform: translateX(194.4px); } }
    .ph2, .ty2 { animation-delay: -8s; }
    .ty2 { animation: type2 12s steps(25, end) infinite -8s; }
    @keyframes type2 { 0%, 31%, 100% { transform: translateX(0); } 10%, 27% { transform: translateX(270.0px); } }
    .ph3, .ty3 { animation-delay: -4s; }
    .ty3 { animation: type3 12s steps(23, end) infinite -4s; }
    @keyframes type3 { 0%, 31%, 100% { transform: translateX(0); } 10%, 27% { transform: translateX(248.4px); } }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes ping    { 0% { opacity: 1; } 38%, 100% { opacity: .16; } }
    @keyframes ripple  { 0% { opacity: .9; transform: scale(1); } 22%, 100% { opacity: 0; transform: scale(5); } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes slide   { to { transform: translateX(-840px); } }
    @keyframes blink   { 50% { opacity: 0; } }
    @keyframes slot    { 0% { opacity: 1; } 33.333%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .sweep, .dial, .blip, .ring, .live, .slide, .blink, .ph, .ty1, .ty2, .ty3 { animation: none; }
      .blip { opacity: .7; }
      .ph1 { opacity: 1; }
      .cover { display: none; }
      .caret1 { transform: translateX(194.4px); }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="300" fill="#241d27"/>
    <rect width="840" height="300" fill="url(#halo)"/>
    <rect width="840" height="300" fill="url(#grid)"/>

    <g mask="url(#radar-mask)">
      <g transform="translate(672 150)">
        <g fill="none" stroke="#f8e9d8" stroke-opacity=".17">
          <circle r="38"/>
          <circle r="76"/>
          <circle r="114"/>
          <circle r="152"/>
          <path d="M-190 0H190M0 -160V160" stroke-opacity=".1"/>
        </g>
        <g class="dial" fill="none" stroke="#f8e9d8" stroke-opacity=".28"><path d="M168.0 0.0L182.0 0.0"/><path d="M165.4 29.2L173.3 30.6"/><path d="M157.9 57.5L165.4 60.2"/><path d="M145.5 84.0L157.6 91.0"/><path d="M128.7 108.0L134.8 113.1"/><path d="M108.0 128.7L113.1 134.8"/><path d="M84.0 145.5L91.0 157.6"/><path d="M57.5 157.9L60.2 165.4"/><path d="M29.2 165.4L30.6 173.3"/><path d="M0.0 168.0L0.0 182.0"/><path d="M-29.2 165.4L-30.6 173.3"/><path d="M-57.5 157.9L-60.2 165.4"/><path d="M-84.0 145.5L-91.0 157.6"/><path d="M-108.0 128.7L-113.1 134.8"/><path d="M-128.7 108.0L-134.8 113.1"/><path d="M-145.5 84.0L-157.6 91.0"/><path d="M-157.9 57.5L-165.4 60.2"/><path d="M-165.4 29.2L-173.3 30.6"/><path d="M-168.0 0.0L-182.0 0.0"/><path d="M-165.4 -29.2L-173.3 -30.6"/><path d="M-157.9 -57.5L-165.4 -60.2"/><path d="M-145.5 -84.0L-157.6 -91.0"/><path d="M-128.7 -108.0L-134.8 -113.1"/><path d="M-108.0 -128.7L-113.1 -134.8"/><path d="M-84.0 -145.5L-91.0 -157.6"/><path d="M-57.5 -157.9L-60.2 -165.4"/><path d="M-29.2 -165.4L-30.6 -173.3"/><path d="M-0.0 -168.0L-0.0 -182.0"/><path d="M29.2 -165.4L30.6 -173.3"/><path d="M57.5 -157.9L60.2 -165.4"/><path d="M84.0 -145.5L91.0 -157.6"/><path d="M108.0 -128.7L113.1 -134.8"/><path d="M128.7 -108.0L134.8 -113.1"/><path d="M145.5 -84.0L157.6 -91.0"/><path d="M157.9 -57.5L165.4 -60.2"/><path d="M165.4 -29.2L173.3 -30.6"/></g>

        <g class="sweep">
          <path d="M0 0L152.00 -0.00A152 152 0 0 0 148.68 -31.60Z" fill="#c5e35b" fill-opacity=".2"/><path d="M0 0L148.68 -31.60A152 152 0 0 0 138.86 -61.82Z" fill="#c5e35b" fill-opacity=".15"/><path d="M0 0L138.86 -61.82A152 152 0 0 0 122.97 -89.34Z" fill="#c5e35b" fill-opacity=".11"/><path d="M0 0L122.97 -89.34A152 152 0 0 0 101.71 -112.96Z" fill="#c5e35b" fill-opacity=".07"/><path d="M0 0L101.71 -112.96A152 152 0 0 0 76.00 -131.64Z" fill="#c5e35b" fill-opacity=".04"/><path d="M0 0L76.00 -131.64A152 152 0 0 0 46.97 -144.56Z" fill="#c5e35b" fill-opacity=".02"/>
          <path d="M0 0H152" stroke="#c5e35b" stroke-width="1.6" filter="url(#glow-line)"/>
        </g>
        <!-- each delay is (angle / 360) * 7s, so a blip lights as the sweep crosses it -->
        <circle class="ring" cx="96" cy="52" r="4" fill="none" stroke="#e77e65" style="animation-delay: 0.55s"/>
        <circle class="blip" cx="96" cy="52" r="4" fill="#e77e65" filter="url(#glow)" style="animation-delay: 0.55s"/>
        <circle class="ring" cx="-30" cy="78" r="3.5" fill="none" stroke="#c5e35b" style="animation-delay: 2.16s"/>
        <circle class="blip" cx="-30" cy="78" r="3.5" fill="#c5e35b" filter="url(#glow)" style="animation-delay: 2.16s"/>
        <circle class="ring" cx="20" cy="-100" r="3" fill="none" stroke="#c5e35b" style="animation-delay: 5.47s"/>
        <circle class="blip" cx="20" cy="-100" r="3" fill="#c5e35b" filter="url(#glow)" style="animation-delay: 5.47s"/>
        <circle class="ring" cx="58" cy="-36" r="3.5" fill="none" stroke="#c5e35b" style="animation-delay: 6.38s"/>
        <circle class="blip" cx="58" cy="-36" r="3.5" fill="#c5e35b" filter="url(#glow)" style="animation-delay: 6.38s"/>
        <circle class="ring" cx="-84" cy="-62" r="3" fill="none" stroke="#c5e35b" style="animation-delay: 4.21s"/>
        <circle class="blip" cx="-84" cy="-62" r="3" fill="#c5e35b" filter="url(#glow)" style="animation-delay: 4.21s"/>

        <circle r="3" fill="#c5e35b" filter="url(#glow)"/>
      </g>
    </g>

    <g fill="none" stroke="#f8e9d8" stroke-opacity=".3"><path d="M38 22H22V38"/><path d="M38 278H22V262"/><path d="M802 22H818V38"/><path d="M802 278H818V262"/></g>

    <rect x="48" y="51" width="9" height="9" fill="#c5e35b"/>
    <text class="mono" x="67" y="60" font-size="14" letter-spacing=".04em" fill="#c5e35b">~/distru3</text>

    <text class="sans" x="46" y="136" font-size="62" font-weight="700" letter-spacing="-.02em" fill="url(#name)">Al-Hussein Raed</text>

    <g clip-path="url(#chip)">
      <rect x="46" y="160" width="340" height="34" fill="#2f2632"/>
      <text class="mono" x="60" y="183" font-size="18" fill="#c0afaf">&gt;</text>
      <g class="ph ph1">
        <text class="mono" x="82" y="183" font-size="18" fill="#e5f394" textLength="194.4" lengthAdjust="spacing" xml:space="preserve">software developer</text>
        <rect class="cover ty1" x="82" y="161" width="300" height="32" fill="#2f2632"/>
        <g class="ty1 caret1"><rect class="blink" x="85" y="168" width="9" height="19" fill="#c5e35b"/></g>
      </g>
      <g class="ph ph2">
        <text class="mono" x="82" y="183" font-size="18" fill="#e5f394" textLength="270.0" lengthAdjust="spacing" xml:space="preserve">react · node.js · laravel</text>
        <rect class="cover ty2" x="82" y="161" width="300" height="32" fill="#2f2632"/>
        <g class="ty2 caret2"><rect class="blink" x="85" y="168" width="9" height="19" fill="#c5e35b"/></g>
      </g>
      <g class="ph ph3">
        <text class="mono" x="82" y="183" font-size="18" fill="#e5f394" textLength="248.4" lengthAdjust="spacing" xml:space="preserve">building tether in rust</text>
        <rect class="cover ty3" x="82" y="161" width="300" height="32" fill="#2f2632"/>
        <g class="ty3 caret3"><rect class="blink" x="85" y="168" width="9" height="19" fill="#c5e35b"/></g>
      </g>
    </g>
    <rect x="46.5" y="160.5" width="339" height="33" rx="5.5" fill="none" stroke="#f8e9d8" stroke-opacity=".16"/>

    <text class="mono" x="48" y="246" font-size="14" fill="#c0afaf">Sharqia, Egypt</text>
    <circle class="live" cx="196" cy="241" r="4" fill="#c5e35b"/>
    <text class="mono" x="208" y="246" font-size="14" fill="#c0afaf">open to software roles</text>

    <rect class="slide" y="297" width="1680" height="3" fill="url(#accent)"/>
  </g>

  <rect x=".5" y=".5" width="839" height="299" rx="13.5" fill="none" stroke="#f8e9d8" stroke-opacity=".14"/>
</svg>
